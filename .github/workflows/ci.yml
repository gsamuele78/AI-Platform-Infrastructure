name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, compose render)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: make lint

  unit:
    name: Unit + policy tests (bats, stubbed hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - run: make test

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - run: make secrets

  integration:
    name: Integration (real gateway/UI/DB, fake GPU backend)
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      # Run as root, like production (RUNBOOK): TLS files are root-owned 0600
      # and the ingress has no DAC_OVERRIDE, so a runner-owned key is unreadable.
      - run: sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - run: sudo --preserve-env=PATH make integration
