name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (shellcheck, compose render)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make lint

  unit:
    name: Unit + policy tests (bats, stubbed hardware)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - run: make test

  mutation:
    name: Mutation tests (every policy check can fail)
    needs: [unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update -q && sudo apt-get install -y -q bats
      - run: make mutation

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: make secrets

  integration:
    name: Integration (real gateway/UI/DB, fake GPU backend)
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run as root, like production (RUNBOOK): TLS files are root-owned 0600
      # and the ingress has no DAC_OVERRIDE, so a runner-owned key is unreadable.
      - run: sudo git config --system --add safe.directory "$GITHUB_WORKSPACE"
      - run: sudo --preserve-env=PATH make integration
