# LifeWatch ERIC local AI platform: single-node stack.
# Always run through the Makefile / scripts/deploy so both env files are loaded:
#   docker compose --env-file profiles/<profile>.env --env-file .env ...
# profiles/*.env (committed) = model and capacity per GPU profile (ADR-012);
#                              deploy picks one by hardware detection
# .env           (0600, never committed) = secrets, see .env.example
name: lifewatch

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  # Inference backend. Internal network only: no egress, no published port.
  # Weights must be pre-staged with scripts/vm/fetch-model.sh (HF_HUB_OFFLINE=1).
  vllm-backend:
    image: vllm/vllm-openai:v0.31.0@sha256:c1c9f6fd5c109ba7f0546a59f5b2f15fb87f64c77782e90a27b648b42a8e67c3
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "1"
      VLLM_API_KEY: ${VLLM_API_KEY:?set VLLM_API_KEY in .env}
      NCCL_DEBUG: WARN
      # Passthrough GPUs in a VM usually cannot do PCIe peer-to-peer; NCCL P2P
      # attempts there can hang. Keep disabled until `nvidia-smi topo -p2p r`
      # shows OK inside the guest (see docs/operations/RUNBOOK.md).
      NCCL_P2P_DISABLE: "1"
    volumes:
      - ${MODEL_CACHE_DIR:?}:/root/.cache/huggingface:ro
    shm_size: 16gb
    security_opt: ["no-new-privileges:true"]
    # No cpus/memory limit (HC-01 exception): vLLM owns the VM and its peak
    # host memory while loading weights depends on the model; a guessed limit
    # kills it mid-load. The other services are capped so they cannot starve it.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:?}
              capabilities: [gpu]
    command:
      - --model=${MODEL_ID:?}
      - --revision
      - ${MODEL_REVISION:?}
      - --served-model-name=${SERVED_MODEL_NAME:?}
      - --tensor-parallel-size=${VLLM_TENSOR_PARALLEL_SIZE:?}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:?}
      - --kv-cache-dtype=${VLLM_KV_CACHE_DTYPE:?}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:?}
      - --max-num-seqs=${VLLM_MAX_NUM_SEQS:?}
      # Agents need OpenAI tool calling (ADR-014); the parser must match the
      # model family, so it comes from the profile.
      - --enable-auto-tool-choice
      - --tool-call-parser=${VLLM_TOOL_CALL_PARSER:?}
      - --reasoning-parser=${VLLM_REASONING_PARSER:?}
      # JSON: server-side chat template defaults (e.g. preserve_thinking) and
      # images/videos accepted per prompt ({"image":0,"video":0} = text only).
      - --default-chat-template-kwargs=${VLLM_CHAT_TEMPLATE_KWARGS:?}
      - --limit-mm-per-prompt=${VLLM_LIMIT_MM_PER_PROMPT:?}
      - --port=8000
      # Custom all-reduce needs P2P; same reason as NCCL_P2P_DISABLE above.
      - --disable-custom-all-reduce
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Loading tens of GB of weights and capturing CUDA graphs takes minutes.
      start_period: 1200s
    networks: [backend-net]
    logging: *logging

  # API gateway: auth (virtual keys), quotas, audit. The only path to vLLM.
  litellm-gateway:
    image: ghcr.io/berriai/litellm-database:v1.104.2@sha256:5a9ff0fd7177372f2ccd8949cb121f67e281f4d13d026af51f9c096c0626f50a
    restart: unless-stopped
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}
      VLLM_API_KEY: ${VLLM_API_KEY:?}
      STORE_MODEL_IN_DB: "False"
      LITELLM_TELEMETRY: "False"
      LITELLM_LOG: WARNING
    volumes:
      - ./configs/proxy/config.yaml:/app/config.yaml:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4g
          pids: 512
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks: [frontend-net, backend-net]
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Web UI: human users authenticate here via Keycloak OIDC. Public access only
  # through the TLS ingress; the loopback port is for operators.
  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      OPENAI_API_BASE_URL: http://litellm-gateway:4000/v1
      # A scoped LiteLLM virtual key (scripts/ops/issue-key.sh), never the master key.
      OPENAI_API_KEY: ${OPENWEBUI_API_KEY:-}
      ENABLE_OLLAMA_API: "false"
      WEBUI_URL: ${WEBUI_URL:?}
      CORS_ALLOW_ORIGIN: ${WEBUI_URL:?}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?set WEBUI_SECRET_KEY in .env}
      WEBUI_AUTH: "true"
      ENABLE_SIGNUP: ${WEBUI_ENABLE_SIGNUP:-false}
      DEFAULT_USER_ROLE: pending
      ENABLE_OAUTH_SIGNUP: "true"
      OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "false"
      OAUTH_PROVIDER_NAME: LifeWatch ERIC
      OAUTH_CLIENT_ID: ${OIDC_CLIENT_ID:?}
      OAUTH_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?}
      OPENID_PROVIDER_URL: ${OIDC_DISCOVERY_URL:?}
      OAUTH_SCOPES: openid email profile
      # RBAC from Keycloak (docs/operations/KEYCLOAK_CLIENT.md): a client role
      # in OIDC_USER_ROLES grants access, one in OIDC_ADMIN_ROLES makes an admin,
      # a roles claim without either is refused (403), no roles claim at all
      # leaves the account pending. Keycloak groups are synced into existing
      # Open WebUI groups (model and knowledge sharing per project); groups are
      # never created automatically. Values set later in the admin UI override
      # these defaults (Open WebUI stores them).
      ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
      OAUTH_ROLES_CLAIM: ${OIDC_ROLES_CLAIM:-lifewatch_roles}
      OAUTH_ALLOWED_ROLES: ${OIDC_USER_ROLES:-ai-user}
      OAUTH_ADMIN_ROLES: ${OIDC_ADMIN_ROLES:-ai-admin}
      ENABLE_OAUTH_GROUP_MANAGEMENT: "true"
      ENABLE_OAUTH_GROUP_CREATION: "false"
      OAUTH_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      ANONYMIZED_TELEMETRY: "false"
      DO_NOT_TRACK: "true"
      SCARF_NO_ANALYTICS: "true"
    volumes:
      - openwebui_data:/app/backend/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
          pids: 1024
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks: [frontend-net]
    depends_on:
      litellm-gateway:
        condition: service_healthy
    logging: *logging

  # TLS ingress: the only service published beyond loopback.
  #   443  -> Open WebUI          8443 -> LiteLLM /v1/* only (no admin API)
  #   80   -> ACME HTTP-01 challenges, everything else redirected to HTTPS
  # Certificates come from TLS_DIR/live (scripts/ops/tls-selfsigned.sh, then
  # scripts/ops/tls-letsencrypt.sh); nginx only reads them.
  ingress:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    restart: unless-stopped
    ports:
      - "${INGRESS_BIND:-0.0.0.0}:${INGRESS_HTTP_PORT:-80}:80"
      - "${INGRESS_BIND:-0.0.0.0}:${INGRESS_HTTPS_PORT:-443}:443"
      - "${INGRESS_BIND:-0.0.0.0}:${INGRESS_API_PORT:-8443}:8443"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?set PUBLIC_HOSTNAME in .env}
      # host[:port] used in the HTTP->HTTPS redirect (port only if not 443)
      PUBLIC_HTTPS_AUTHORITY: ${INGRESS_REDIRECT_AUTHORITY:-${PUBLIC_HOSTNAME}}
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    volumes:
      - ./configs/ingress/templates:/etc/nginx/templates:ro
      - ./configs/ingress/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_DIR:?set TLS_DIR in .env}/live:/etc/nginx/tls:ro
      - ${TLS_DIR:?}/acme-webroot:/var/www/acme:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512m
          pids: 256
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      frontend-net:
        # Containers (and the ACME test server in CI) reach the ingress by its public name.
        aliases: ["${PUBLIC_HOSTNAME:?}"]
    logging: *logging

  # One-shot tool, never started by a deploy: scripts/ops/tls-letsencrypt.sh
  # runs it with `docker compose run --rm certbot ...`.
  certbot:
    image: certbot/certbot:v5.8.0@sha256:f70ad0adbb7e117f0fe42a63c553f28ea451edabc0148757b6efcd9735acaa20
    profiles: [tools]
    volumes:
      - ${TLS_DIR:?}/letsencrypt:/etc/letsencrypt
      - ${TLS_DIR:?}/acme-webroot:/var/www/acme
    security_opt: ["no-new-privileges:true"]
    networks: [frontend-net]
    logging: *logging

  # Gateway state: virtual keys, budgets, spend/audit logs. Backed up by
  # scripts/ops/backup.sh before every deploy.
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g
          pids: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend-net]
    logging: *logging

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: true

volumes:
  openwebui_data:
  postgres_data:
